<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Kod Muharriri – W3Learn Playground</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css"/>
<style>
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .editor-topbar {
    height: 54px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }
  .editor-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    transition: var(--transition);
  }
  .btn-action:hover {
    border-color: var(--green);
    color: var(--green-light);
  }
  .btn-run-action {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: #fff;
    border: none;
    box-shadow: 0 2px 10px rgba(4,170,109,0.3);
  }
  .btn-run-action:hover {
    box-shadow: 0 4px 16px rgba(4,170,109,0.5);
    transform: translateY(-1px);
  }
  .template-select {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .editor-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .editor-panes {
    display: flex;
    flex-direction: column;
    width: 50%;
    border-right: 1px solid var(--border);
  }
  .code-pane {
    display: flex;
    flex-direction: column;
    flex: 1;
    border-bottom: 1px solid var(--border);
    min-height: 120px;
  }
  .code-pane:last-child {
    border-bottom: none;
  }
  .pane-header {
    background: rgba(0,0,0,0.25);
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .pane-header span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .code-input {
    flex: 1;
    width: 100%;
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 12px 16px;
    border: none;
    outline: none;
    resize: none;
    tab-size: 2;
  }
  .preview-pane {
    width: 50%;
    display: flex;
    flex-direction: column;
    background: #ffffff;
  }
  .preview-header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .preview-iframe {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
    background: #ffffff;
  }
  .console-box {
    height: 110px;
    background: #090d16;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .console-header {
    background: rgba(255,255,255,0.03);
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .console-logs {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px;
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    color: #8be9fd;
  }
  .console-logs .log-item {
    margin-bottom: 3px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  @media (max-width: 850px) {
    .editor-container { flex-direction: column; }
    .editor-panes { width: 100%; height: 50%; border-right: none; }
    .preview-pane { width: 100%; height: 50%; }
  }
</style>
</head>
<body>

<div class="editor-topbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <a href="index.html" class="logo" style="font-size:19px;">W3<span>Learn</span></a>
    <span style="font-size:12px;font-weight:700;color:var(--green-light);background:rgba(4,170,109,0.12);padding:3px 8px;border-radius:4px;">
      <i class="fa-solid fa-code"></i> Live Playground
    </span>
  </div>

  <div class="editor-actions">
    <select class="template-select" id="templateSelect" onchange="loadTemplate()">
      <option value="starter">Andoza: Boshlang'ich HTML</option>
      <option value="card">Andoza: Glassmorphism Card</option>
      <option value="button">Andoza: Neon Button Animatsiya</option>
      <option value="calc">Andoza: Mini Kalkulyator</option>
    </select>
    <button class="btn-action btn-run-action" onclick="runPlayground()">
      <i class="fa-solid fa-play"></i> Ishga tushirish (Run)
    </button>
    <button class="btn-action" onclick="resetCode()">
      <i class="fa-solid fa-rotate-right"></i> Tozalash
    </button>
    <button class="btn-action" onclick="copyFullCode()">
      <i class="fa-solid fa-copy"></i> Nusxa olish
    </button>
    <a href="index.html" class="btn-action">
      <i class="fa-solid fa-house"></i> Bosh sahifa
    </a>
  </div>
</div>

<div class="editor-container">
  <!-- Code Panes -->
  <div class="editor-panes">
    <!-- HTML -->
    <div class="code-pane">
      <div class="pane-header">
        <span><i class="devicon-html5-plain" style="color:#e44d26"></i> HTML</span>
        <span style="color:var(--text3);font-size:10px;">&lt;body&gt; tarkibi</span>
      </div>
      <textarea class="code-input" id="htmlCode" spellcheck="false" oninput="autoRun()"></textarea>
    </div>

    <!-- CSS -->
    <div class="code-pane">
      <div class="pane-header">
        <span><i class="devicon-css3-plain" style="color:#264de4"></i> CSS</span>
        <span style="color:var(--text3);font-size:10px;">Stil qoidalari</span>
      </div>
      <textarea class="code-input" id="cssCode" spellcheck="false" oninput="autoRun()"></textarea>
    </div>

    <!-- JS -->
    <div class="code-pane">
      <div class="pane-header">
        <span><i class="devicon-javascript-plain" style="color:#f7df1e"></i> JavaScript</span>
        <span style="color:var(--text3);font-size:10px;">Skript mantiqi</span>
      </div>
      <textarea class="code-input" id="jsCode" spellcheck="false" oninput="autoRun()"></textarea>
    </div>
  </div>

  <!-- Preview Pane -->
  <div class="preview-pane">
    <div class="preview-header">
      <span><i class="fa-solid fa-globe"></i> Jonli Natija (Live Preview)</span>
      <span style="font-size:11px;color:var(--green);"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Real-vaqtli yangilanadi</span>
    </div>
    <iframe class="preview-iframe" id="previewIframe"></iframe>

    <!-- Console Output -->
    <div class="console-box">
      <div class="console-header">
        <span><i class="fa-solid fa-terminal"></i> Brauzer Konsoli</span>
        <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;" onclick="clearConsole()">Tozalash</button>
      </div>
      <div class="console-logs" id="consoleLogs">
        <div class="log-item" style="color:var(--text3);">Console tayyor. log() xabarlari shu yerda aks etadi.</div>
      </div>
    </div>
  </div>
</div>

<script>
const templates = {
  starter: {
    html: `<div class="container">\n  <h1>Salom, W3Learn! 👋</h1>\n  <p>Bu yerda o'z HTML, CSS va JavaScript kodlaringizni jonli sinab ko'rishingiz mumkin.</p>\n  <button id="myBtn">Meni bosing!</button>\n  <div id="output"></div>\n</div>`,
    css: `body {\n  font-family: 'Segoe UI', Tahoma, sans-serif;\n  background: linear-gradient(135deg, #1f2937, #111827);\n  color: #fff;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  min-height: 100vh;\n  margin: 0;\n}\n.container {\n  background: rgba(255, 255, 255, 0.05);\n  padding: 30px 40px;\n  border-radius: 16px;\n  border: 1px solid rgba(255, 255, 255, 0.1);\n  text-align: center;\n  box-shadow: 0 10px 30px rgba(0,0,0,0.5);\n}\nh1 {\n  color: #04AA6D;\n  margin-bottom: 10px;\n}\nbutton {\n  background: #04AA6D;\n  color: white;\n  border: none;\n  padding: 10px 24px;\n  border-radius: 8px;\n  font-size: 15px;\n  cursor: pointer;\n  font-weight: bold;\n  transition: 0.2s;\n}\nbutton:hover {\n  background: #00d4a0;\n  transform: translateY(-2px);\n}\n#output {\n  margin-top: 15px;\n  font-weight: 500;\n  color: #61DAFB;\n}`,
    js: `document.getElementById('myBtn').addEventListener('click', function() {\n  const now = new Date().toLocaleTimeString();\n  document.getElementById('output').textContent = '✅ Tugma bosildi: ' + now;\n  console.log('Foydalanuvchi tugmani bosdi: ' + now);\n});`
  },
  card: {
    html: `<div class="card">\n  <div class="avatar">👨‍💻</div>\n  <h2>Dasturchi</h2>\n  <p class="role">Frontend & Backend Dasturchi</p>\n  <div class="skills">\n    <span>React</span>\n    <span>Python</span>\n    <span>Docker</span>\n  </div>\n  <button class="connect-btn">Bog'lanish</button>\n</div>`,
    css: `body {\n  background: #0b0f19;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n  font-family: sans-serif;\n}\n.card {\n  background: rgba(255, 255, 255, 0.04);\n  backdrop-filter: blur(12px);\n  border: 1px solid rgba(255, 255, 255, 0.1);\n  border-radius: 20px;\n  padding: 30px;\n  text-align: center;\n  width: 280px;\n  color: #fff;\n  box-shadow: 0 20px 40px rgba(0,0,0,0.4);\n}\n.avatar {\n  font-size: 50px;\n  margin-bottom: 10px;\n}\nh2 { margin: 10px 0 5px; color: #fff; }\n.role { color: #8b9bb4; font-size: 13px; margin-bottom: 20px; }\n.skills span {\n  background: rgba(4, 170, 109, 0.15);\n  color: #00d4a0;\n  padding: 4px 10px;\n  border-radius: 12px;\n  font-size: 11px;\n  font-weight: 600;\n  margin: 0 3px;\n}\n.connect-btn {\n  margin-top: 25px;\n  width: 100%;\n  padding: 10px;\n  background: linear-gradient(135deg, #04AA6D, #038a57);\n  border: none;\n  color: white;\n  font-weight: bold;\n  border-radius: 8px;\n  cursor: pointer;\n}`,
    js: `console.log('Glassmorphism card yuklandi!');\ndocument.querySelector('.connect-btn').onclick = () => alert("Salom! Profil bilan tanishganingiz uchun rahmat.");`
  },
  button: {
    html: `<div class="center">\n  <a href="#" class="neon-btn">W3LEARN NEON</a>\n</div>`,
    css: `body {\n  background: #050811;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n  font-family: 'Inter', sans-serif;\n}\n.neon-btn {\n  position: relative;\n  display: inline-block;\n  padding: 18px 36px;\n  color: #00d4a0;\n  font-size: 18px;\n  text-transform: uppercase;\n  letter-spacing: 4px;\n  text-decoration: none;\n  font-weight: bold;\n  overflow: hidden;\n  border: 2px solid #00d4a0;\n  border-radius: 8px;\n  box-shadow: 0 0 25px rgba(0,212,160,0.4);\n  transition: 0.3s;\n}\n.neon-btn:hover {\n  background: #00d4a0;\n  color: #050811;\n  box-shadow: 0 0 50px rgba(0,212,160,0.9);\n}`,
    js: `console.log('Neon animatsiya tayyor!');`
  },
  calc: {
    html: `<div class="calc">\n  <input type="text" id="display" readonly placeholder="0"/>\n  <div class="keys">\n    <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('/')">/</button>\n    <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('*')">*</button>\n    <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('-')">-</button>\n    <button onclick="clr()">C</button><button onclick="press('0')">0</button><button class="eq" onclick="calc()">=</button><button class="op" onclick="press('+')">+</button>\n  </div>\n</div>`,
    css: `body { background: #111827; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: monospace; }\n.calc { background: #1f2937; padding: 20px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); width: 240px; }\n#display { width: 100%; height: 50px; background: #0b0f19; border: 1px solid #374151; border-radius: 8px; color: #10b981; font-size: 22px; text-align: right; padding: 0 10px; box-sizing: border-box; margin-bottom: 15px; outline: none; }\n.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\nbutton { height: 45px; background: #374151; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }\nbutton:hover { background: #4b5563; }\nbutton.op { background: #f59e0b; }\nbutton.eq { background: #10b981; }`,
    js: `function press(val) { document.getElementById('display').value += val; }\nfunction clr() { document.getElementById('display').value = ''; }\nfunction calc() {\n  try {\n    const res = eval(document.getElementById('display').value);\n    document.getElementById('display').value = res;\n    console.log('Natija:', res);\n  } catch(e) {\n    document.getElementById('display').value = 'Xato';\n    console.error('Kalkulyator xatosi');\n  }\n}`
  }
};

function loadTemplate() {
  const t = templates[document.getElementById('templateSelect').value] || templates.starter;
  document.getElementById('htmlCode').value = t.html;
  document.getElementById('cssCode').value = t.css;
  document.getElementById('jsCode').value = t.js;
  runPlayground();
}

function runPlayground() {
  const html = document.getElementById('htmlCode').value;
  const css = document.getElementById('cssCode').value;
  const js = document.getElementById('jsCode').value;
  const iframe = document.getElementById('previewIframe');

  const combined = `
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="UTF-8"/>
        <style>
          ${css}
        </style>
      </head>
      <body>
        ${html}
        <script>
          // Override console.log to communicate with parent
          const oldLog = console.log;
          console.log = function(...args) {
            oldLog.apply(console, args);
            window.parent.postMessage({ type: 'CONSOLE_LOG', msg: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') }, '*');
          };
          window.onerror = function(msg, url, line) {
            window.parent.postMessage({ type: 'CONSOLE_ERROR', msg: 'Xato (satr ' + line + '): ' + msg }, '*');
          };
          try {
            ${js}
          } catch(err) {
            console.log('JS Xato: ' + err.message);
          }
        <\/script>
      </body>
    </html>
  `;

  iframe.srcdoc = combined;
}

let autoRunTimer;
function autoRun() {
  clearTimeout(autoRunTimer);
  autoRunTimer = setTimeout(runPlayground, 500);
}

function clearConsole() {
  document.getElementById('consoleLogs').innerHTML = '<div class="log-item" style="color:var(--text3);">Konsol tozalandi.</div>';
}

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'CONSOLE_LOG') {
    const logs = document.getElementById('consoleLogs');
    const div = document.createElement('div');
    div.className = 'log-item';
    div.textContent = '› ' + e.data.msg;
    logs.appendChild(div);
    logs.scrollTop = logs.scrollHeight;
  } else if (e.data && e.data.type === 'CONSOLE_ERROR') {
    const logs = document.getElementById('consoleLogs');
    const div = document.createElement('div');
    div.className = 'log-item';
    div.style.color = '#ff6b6b';
    div.textContent = '⚠ ' + e.data.msg;
    logs.appendChild(div);
    logs.scrollTop = logs.scrollHeight;
  }
});

function resetCode() {
  if (confirm("Kodni tozalashni xohlaysizmi?")) {
    document.getElementById('htmlCode').value = '';
    document.getElementById('cssCode').value = '';
    document.getElementById('jsCode').value = '';
    runPlayground();
    clearConsole();
  }
}

function copyFullCode() {
  const full = `<!-- HTML -->\n${document.getElementById('htmlCode').value}\n\n/* CSS */\n${document.getElementById('cssCode').value}\n\n// JavaScript\n${document.getElementById('jsCode').value}`;
  navigator.clipboard.writeText(full).then(() => alert("Barcha kodlar nusxalandi!"));
}

// Boshlang'ich andozani yuklash
loadTemplate();
</script>

</body>
</html>
